
<link href="https://jsdelivr.net" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  .large-input {
    width: 100%; /* Makes the box span the full container width */
    max-width: 1000px; /* Or set a fixed width like 400px */
    height: 40px; /* Increases the vertical height */
    font-size: 18px; /* Enlarges text inside the box for proportion */
    padding: 5px 5px 0px 50px; /* Adds internal spacing */
    margin-bottom: 50px;
  }


  #posts-container {
    width: 100% !important;
    margin: 2rem auto !important; /* Centers the container */
  }

  .posts-grid-filter, .products-grid-filter, .quotes-grid-filter {
    grid-column: 1 / -1; /* Spans from the first column to the last column */
  }
  /* The Three-Column Grid structure */
  .posts-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
  }
  /* Card Styling */
  .post-card {
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .post-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: #1f2937;
    margin-top: 0;
    margin-bottom: 12px;
    text-transform: capitalize;
  }

  .post-body {
    color: #4b5563;
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 16px;
    flex-grow: 1;
  }

  .post-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    background-color: #e0e7ff;
    color: #4338ca;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
  }
  /* Responsive adjustments for tablet and mobile layout */
  @media (max-width: 1024px) {
    .posts-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 640px) {
    .posts-grid {
      grid-template-columns: repeat(1, minmax(0, 1fr));
    }
  }

  nav a,
  nav li {
    font-size: 20px;
    font-weight: 400; /* Use 500 for a slightly stronger medium weight */
  }



  .cart-quantity-wrapper {
    display: inline-flex;
    align-items: center;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    overflow: hidden;
    background-color: #f9fafb;
    margin-left: 30px;
  }


  .cart-item {
    display: flex;
    gap: 20px; /* Puts 20px of space between all child elements */
    margin-top: 10px;
  }


  #cart {
    scroll-margin-top: 200px;
  }

  .cart-summary {
    // border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 20px;
    margin-top: 20px;
    background-color: #f9fafb;
  }
</style>







<div class="quotes-container" *ngIf="quotes.length > 0">


  <h1 id="products" class="title">
    Data fetched from API ---
  </h1>
  <h1 id="quotes" class="title">Inspirational Quotes</h1>

  <div class="quotes-grid-filter">

    <input type="text" class="large-input"
           [(ngModel)]="searchQuoteTerm"
           (input)="filterQuotes()"
           placeholder="Filter by quote or author..." />
  </div>


  <div class="quotes-grid">

    <div class="quote-card" *ngFor="let q of filteredQuotes | slice:0:9">
      <span class="quote-icon">“</span>
      <blockquote class="quote-text">{{ q.quote }}</blockquote>
      <cite class="quote-author">— {{ q.author }}</cite>
    </div>
  </div>
</div>
