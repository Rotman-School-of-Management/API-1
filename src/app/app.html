<div *ngIf="faculty" class="faculty-card">
  <h2>{{ faculty.lastName }} (ID: {{ faculty.id }})</h2>
  <p><strong>Faculty ID:</strong> {{ faculty.facultyId }}</p>
  <p><strong>Division:</strong> {{ faculty.division }}</p>

  <h3>Publications</h3>
  <ul>
    <li *ngFor="let pub of faculty.publications">
      <strong>{{ pub.title }}</strong> ({{ pub.year }})
    </li>
  </ul>


</div>
