<style>
.custom-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
  margin: 16px 0;
}

.custom-table th,
.custom-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

.custom-table th {
  background-color: #f4f4f5;
  font-weight: 600;
  color: #333;
}

.custom-table tr:hover {
  background-color: #f1f5f9;
}

</style>



<div style="padding: 20px; font-family: sans-serif;">
  <h2>Product Dashboard</h2>

  <!-- Error Alert -->
  <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px;">
    {{ errorMessage }}
  </div>

  <!-- SECTION 1: Standard HTML Datatable -->
  <h3>1. Product Datatable</h3>
  <table class="custom-table">
    <thead>
      <tr style="background-color: #f2f2f2; text-align: left;">
        <th>ID</th>
        <th>Product Name</th>
        <th>Price</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency }}</td>


      </tr>
      <tr *ngIf="products.length === 0 && !errorMessage">
        <td colspan="4" style="text-align: center;">Loading products...</td>
      </tr>
    </tbody>
  </table>

  <!-- SECTION 2: Raw JSON View -->
  <h3>2. Raw JSON Output</h3>
  <pre style="background-color: #f4f4f4; padding: 15px; border: 1px solid #ddd; border-radius: 4px; max-height: 300px; overflow-y: auto;">
    {{ products | json }}
  </pre>
</div>
