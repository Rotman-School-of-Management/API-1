<style>
.custom-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
  margin: 16px 0;
}

.custom-table th,
.custom-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

.custom-table th {
  background-color: #f4f4f5;
  font-weight: 600;
  color: #333;
}

.custom-table tr:hover {
  background-color: #f1f5f9;
}


.json-viewer {
  background-color: #1e1e1e;
  color: #dcdcdc;
  padding: 16px;
  border-radius: 6px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
}
</style>


<div style="padding: 20px;">
  <h3>{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h3>
  <form (ngSubmit)="saveProduct()">
   Item Name: <input [(ngModel)]="currentProduct.name" name="name" placeholder="Product Name" required /><br><br>
   Price: <input type="number" [(ngModel)]="currentProduct.price" name="price" placeholder="Price" required /><br><br>
   Id: <input type="number" [(ngModel)]="currentProduct.id" name="id" placeholder="id" required /><br><br>

    <button type="submit">{{ isEditMode ? 'Update' : 'Save' }}</button>
    <button type="button" *ngIf="isEditMode" (click)="resetForm()">Cancel</button>
  </form>

  <hr>

  <h3>Product List</h3>
  <table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%;">
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <button (click)="editProduct(product)">Edit</button>
          <button (click)="deleteProduct(product.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
