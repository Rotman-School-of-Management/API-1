<form class="contact-form" [formGroup]="contactForm" (submit)="sendEmail($event)">
  <div>
    <label for="user_name">Name</label>
    <input type="text" id="user_name" name="user_name" formControlName="user_name" required>
  </div>
  <div>
    <label for="user_email">Email</label>
    <input type="email" id="user_email" name="user_email" formControlName="user_email" required>
  </div>
  <div>
    <label for="message">Message</label>
    <textarea id="message" name="message" formControlName="message" required></textarea>
  </div>
  <input type="submit" value="Send">
</form>
