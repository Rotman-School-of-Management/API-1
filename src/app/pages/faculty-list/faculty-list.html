<!-- src/app/pages/faculty-list/faculty-list.component.html -->
<div style="padding: 20px; font-family: sans-serif;">
  <h2>Faculty Directory</h2>
  <table border="1" cellpadding="10" style="border-collapse: collapse; width: 100%;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th>Last Name</th>
        <th>Division</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let member of facultyMembers">
        <td><strong>{{ member.name }}</strong></td>
        <td>{{ member.department }}</td>
        <td>
          <a [routerLink]="['/faculty', member.id]">View Publications ({{ member.publications.length }})</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
